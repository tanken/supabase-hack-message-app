<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Message in a Bottle</title>
<meta name="description" content="Receive an encouraging message from a stranger, or leave one for the next person to find." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="." data-nav="home">
      <span class="brand-mark"><i class="ph-bold ph-paper-plane-tilt"></i></span>
      <span class="brand-word">Message in a Bottle</span>
    </a>
    <nav class="tabs" aria-label="Primary">
      <button class="tab is-active" data-nav="home" aria-current="page">
        <i class="ph ph-house"></i><span>Home</span>
      </button>
      <button class="tab" data-nav="gallery">
        <i class="ph ph-books"></i><span>Gallery</span>
      </button>
      <button class="tab" data-nav="write">
        <i class="ph ph-feather"></i><span>Write</span>
      </button>
    </nav>
  </header>

  <main id="stage" class="stage">
    <!-- views are rendered here by app.js -->
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
